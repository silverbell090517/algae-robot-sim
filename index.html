<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGA-ROVER // 수면 녹조 회수 로봇 구동 시뮬레이션</title>
<style>
  :root{
    --bg-deep:#081a1e;
    --cyan:#4fd1c5;
    --text-hi:#e7f3f2;
    --text-dim:#7fa8a5;
    --font-mono: 'SFMono-Regular', Consolas, 'Roboto Mono', ui-monospace, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    font-family:var(--font-mono);
    overflow:hidden;
    color:var(--text-hi);
  }
  #app{ position:relative; width:100vw; height:100vh; }
  canvas#scene{ position:absolute; inset:0; display:block; }

  #speedPanel{
    position:absolute; z-index:6; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:rgba(8,26,30,0.55); border:1px solid rgba(79,209,197,0.28);
    padding:10px 22px; backdrop-filter: blur(2px);
  }
  #speedPanel label{ font-size:10px; letter-spacing:0.1em; color:var(--text-dim); }
  #speedVal{ color:var(--cyan); }
  input[type=range]{
    -webkit-appearance:none; width:200px; height:2px; background:rgba(79,209,197,0.28); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--cyan); cursor:pointer; box-shadow:0 0 5px var(--cyan);
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="speedPanel">
    <label>SPEED <span id="speedVal">1.0x</span></label>
    <input type="range" id="speedSlider" min="0.3" max="2.5" step="0.1" value="1.0">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ==========================================================
// 0. BASIC SETUP
// ==========================================================
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const bgColor = 0x081a1e;
renderer.setClearColor(bgColor, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(bgColor, 20, 50);

const mainCamera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0x8fd8ff, 0x0a2a24, 0.6));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.1);
sun.position.set(10, 18, 9);
scene.add(해);
const fill = new THREE.DirectionalLight(0x4fd1c5, 0.3);
fill.position.set(-8, 5, -9);
scene.add(fill);

// ==========================================================
// 1. CUSTOM ORBIT-DRAG CAMERA, target follows the robot
// ==========================================================
const camTarget = new THREE.Vector3(0, 1.0, 0);
let camRadius = 12.5, camTheta = Math.PI*0.18, camPhi = Math.PI*0.42;
let dragging = false, lastX=0, lastY=0;

function updateCamera(){
  const sinPhi = Math.sin(camPhi);
  mainCamera.position.set(
    camTarget.x + camRadius*sinPhi*Math.sin(camTheta),
    camTarget.y + camRadius*Math.cos(camPhi),
    camTarget.z + camRadius*sinPhi*Math.cos(camTheta)
  );
  mainCamera.lookAt(camTarget);
}

canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('pointerup', ()=> dragging=false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  camTheta -= dx*0.0055;
  camPhi   -= dy*0.0045;
  camPhi = Math.max(0.12, Math.min(Math.PI*0.49, camPhi));
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camRadius += e.deltaY*0.015;
  camRadius = Math.max(5.5, Math.min(30, camRadius));
}, {passive:false});

// ==========================================================
// 2. WATER (animated shader plane)
// ==========================================================
function waterHeight(x,z,t){
  return 0.16*Math.sin(x*0.35 + t*1.1)*Math.cos(z*0.30 - t*0.9)
       + 0.10*Math.sin((x+z)*0.5 + t*1.6)
       + 0.05*Math.sin(x*0.9 - t*2.0)*Math.sin(z*0.7 + t*1.3);
}

const waterUniforms = {
  uTime:{ value:0 },
  uDeep:{ value:new THREE.Color(0x0c3e46) },
  uShallow:{ value:new THREE.Color(0x2fa39a) },
  uLight:{ value:new THREE.Vector3(0.25,0.2,0.9).normalize() }
};

const waterGeo = new THREE.PlaneGeometry(60,60,90,90);
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent:true,
  side: THREE.DoubleSide,
  vertexShader:`
    uniform float uTime;
    varying float vHeight;
    varying vec3 vNormalL;
    void main(){
      vec3 pos = position;
      float eps = 0.6;
      float h  = 0.16*sin(pos.x*0.35 + uTime*1.1)*cos(pos.y*0.30 - uTime*0.9)
               + 0.10*sin((pos.x+pos.y)*0.5 + uTime*1.6)
               + 0.05*sin(pos.x*0.9 - uTime*2.0)*sin(pos.y*0.7 + uTime*1.3);
      float hx = 0.16*sin((pos.x+eps)*0.35 + uTime*1.1)*cos(pos.y*0.30 - uTime*0.9)
               + 0.10*sin((pos.x+eps+pos.y)*0.5 + uTime*1.6)
               + 0.05*sin((pos.x+eps)*0.9 - uTime*2.0)*sin(pos.y*0.7 + uTime*1.3);
      float hy = 0.16*sin(pos.x*0.35 + uTime*1.1)*cos((pos.y+eps)*0.30 - uTime*0.9)
               + 0.10*sin((pos.x+pos.y+eps)*0.5 + uTime*1.6)
               + 0.05*sin(pos.x*0.9 - uTime*2.0)*sin((pos.y+eps)*0.7 + uTime*1.3);
      vec3 tangentX = normalize(vec3(eps, 0.0, hx-h));
      vec3 tangentY = normalize(vec3(0.0, eps, hy-h));
      vNormalL = normalize(cross(tangentX, tangentY));
      vHeight = h;
      pos.z = h;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader:`
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uLight;
    varying float vHeight;
    varying vec3 vNormalL;
    void main(){
      float diff = clamp(dot(normalize(vNormalL), uLight), 0.0, 1.0);
      vec3 base = mix(uDeep, uShallow, clamp(vHeight*2.2+0.5,0.0,1.0));
      vec3 col = base * (0.55 + 0.55*diff);
      gl_FragColor = vec4(col, 0.88);
    }
  `
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
scene.add(water);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(30,48),
  new THREE.MeshStandardMaterial({color:0x06171a, roughness:1})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.4;
scene.add(floor);

// ==========================================================
// 3. ALGAE PATCHES
// ==========================================================
const algaePositions = [
  [13,2,1.1],[8,11,0.9],[2,15,1.2],[-6,12,1.0],[-13,3,1.1],
  [-13,-6,0.95],[-6,-12,1.15],[3,-14,1.0],[11,-8,1.05],
  [5,5,0.85],[-5,-3,0.9],[-2,8,0.95]
];
const algaeMat = new THREE.MeshStandardMaterial({color:0x5fb84a, roughness:0.85, emissive:0x0e2a08, emissiveIntensity:0.4});
const algaeList = [];
algaePositions.forEach(([x,z,r])=>{
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 14), algaeMat.clone());
  m.rotation.x = -Math.PI/2;
  m.position.set(x, waterHeight(x,z,0)+0.04, z);
  scene.add(m);
  algaeList.push({ mesh:m, x, z, baseR:r, state:'idle', shrinkT:0 });
});

const effects = [];
function spawnAbsorbEffect(x,z){
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.2,0.32,24),
    new THREE.MeshBasicMaterial({color:0x9be89b, transparent:true, opacity:0.9, side:THREE.DoubleSide})
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.set(x, waterHeight(x,z,0)+0.06, z);
  scene.add(ring);
  effects.push({ mesh:ring, t:0, dur:0.6 });
}

// ==========================================================
// 4. PATH
// ==========================================================
const wp = [
  [14,0],[10,10],[0,14],[-10,10],[-15,0],[-10,-10],[0,-13],[10,-9]
].map(p=> new THREE.Vector3(p[0],0,p[1]));
const path = new THREE.CatmullRomCurve3(wp, true, 'catmullrom', 0.5);
const pathLen = path.getLength();

// ==========================================================
// 5. ROBOT CONSTRUCTION
//    T-frame stood up ~90deg: stem points straight down (main
//    wheel at the very bottom of the inner shell -- the point
//    that matters for driving forward rolling), arms splay out
//    to the sides at an angle so their small wheels also press
//    against the inner wall near the bottom, like a tripod.
//    The chassis itself does NOT rotate (its weight keeps it
//    hanging low/steady) -- only the outer shell rolls around
//    it, driven by the wheel/shell friction contact.
// ==========================================================
const SHELL_R = 2.6;
const robotGroup = new THREE.Group();
scene.add(robotGroup);

const chassisGroup = new THREE.Group();
robotGroup.add(chassisGroup);

const frameMat = new THREE.MeshStandardMaterial({color:0x3d7fa6, metalness:0.35, roughness:0.45});
const wheelMat  = new THREE.MeshStandardMaterial({color:0x1c1c22, metalness:0.2, roughness:0.7});
const hubMat    = new THREE.MeshStandardMaterial({color:0x2f6f95, metalness:0.4, roughness:0.35, emissive:0x0a2030, emissiveIntensity:0.3});
const weightMat = new THREE.MeshStandardMaterial({color:0x14181c, metalness:0.6, roughness:0.35});

const WB_R=0.55, WB_W=0.38;   // main (bottom) wheel
const WS_R=0.35, WS_W=0.24;   // side wheels
const LEG_THICK = 0.24;
const HUB_SIZE = 0.62;

function barrelWheelGeometry(r, w, segs){
  const pts = [];
  pts.push(new THREE.Vector2(0.0,       -w/2));
  pts.push(new THREE.Vector2(r*0.55,    -w/2*0.55));
  pts.push(new THREE.Vector2(r,          0.0));
  pts.push(new THREE.Vector2(r*0.55,     w/2*0.55));
  pts.push(new THREE.Vector2(0.0,        w/2));
  return new THREE.LatheGeometry(pts, segs);
}
const bigWheelGeo   = barrelWheelGeometry(WB_R, WB_W, 22);
const smallWheelGeo = barrelWheelGeometry(WS_R, WS_W, 18);

// wheel contact points sit ON the inner wall (radius SHELL_R), wheel
// CENTER is pulled in by its own radius so the outer surface just
// touches the shell from inside.
const GAP = 0.02;
const legAngle = 34 * Math.PI/180; // side-wheel splay from straight-down
const bigWheelPos = new THREE.Vector3(0, -(SHELL_R-WB_R-GAP), 0);
const rightWheelPos = new THREE.Vector3(
  Math.sin(legAngle)*(SHELL_R-WS_R-GAP), -Math.cos(legAngle)*(SHELL_R-WS_R-GAP), 0);
const leftWheelPos = new THREE.Vector3(
  -Math.sin(legAngle)*(SHELL_R-WS_R-GAP), -Math.cos(legAngle)*(SHELL_R-WS_R-GAP), 0);
const hubPos = new THREE.Vector3(0, -1.15, 0);

function makeLegBar(fromV, toV, thickness){
  const dir = new THREE.Vector3().subVectors(toV, fromV);
  const len = dir.length();
  const bar = new THREE.Mesh(new THREE.BoxGeometry(thickness, thickness, len), frameMat);
  bar.position.copy(fromV).add(toV).multiplyScalar(0.5);
  bar.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir.clone().normalize());
  return bar;
}
function makeWheel(geo, pos){
  const w = new THREE.Mesh(geo, wheelMat);
  w.position.copy(pos);
  w.rotateZ(Math.PI/2); // axle -> local X (perpendicular to travel dir Z)
  return w;
}

const hub = new THREE.Mesh(new THREE.BoxGeometry(HUB_SIZE,HUB_SIZE,HUB_SIZE), hubMat);
hub.position.copy(hubPos);
chassisGroup.add(hub);

// visible ballast weight just under the hub (low center of mass)
const weight = new THREE.Mesh(new THREE.SphereGeometry(0.26,16,12), weightMat);
weight.position.copy(hubPos).add(new THREE.Vector3(0,-0.36,0));
chassisGroup.add(weight);

chassisGroup.add(makeLegBar(hubPos, bigWheelPos, LEG_THICK));
chassisGroup.add(makeLegBar(hubPos, rightWheelPos, LEG_THICK*0.85));
chassisGroup.add(makeLegBar(hubPos, leftWheelPos, LEG_THICK*0.85));

const bigWheel = makeWheel(bigWheelGeo, bigWheelPos);
const rightWheel = makeWheel(smallWheelGeo, rightWheelPos);
const leftWheel = makeWheel(smallWheelGeo, leftWheelPos);
chassisGroup.add(bigWheel, rightWheel, leftWheel);

// small onboard camera prop (visual detail only, no UI feed)
const camMount = new THREE.Group();
camMount.position.copy(hubPos).add(new THREE.Vector3(0, 0.22, -0.42));
chassisGroup.add(camMount);
const camBody = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,0.22), new THREE.MeshStandardMaterial({color:0x111318, metalness:0.5, roughness:0.4}));
camMount.add(camBody);
const camLens = new THREE.Mesh(new THREE.ConeGeometry(0.07,0.13,14), new THREE.MeshStandardMaterial({color:0x0d0d10, metalness:0.7, roughness:0.2}));
camLens.rotation.x = Math.PI/2;
camLens.position.z = -0.16;
camMount.add(camLens);
const camGlow = new THREE.PointLight(0x4fd1c5, 0.35, 1.8);
camMount.add(camGlow);

// ---- Shell (single transparent sphere that rolls) ----
const shellGroup = new THREE.Group();
robotGroup.add(shellGroup);
const shellMat = new THREE.MeshPhysicalMaterial({
  color:0xbfe9ff, transparent:true, opacity:0.22, roughness:0.12, metalness:0.05,
  transmission:0.2, side:THREE.FrontSide, depthWrite:false
});
shellGroup.add(new THREE.Mesh(new THREE.SphereGeometry(SHELL_R,48,32), shellMat));

// suction cups on the shell surface (fibonacci sphere distribution)
const cupGeo = new THREE.CylinderGeometry(0.11,0.13,0.09,10);
const cupMat = new THREE.MeshStandardMaterial({color:0x0e3a3a, roughness:0.6, metalness:0.1});
const CUP_COUNT = 46;
const golden = Math.PI*(3-Math.sqrt(5));
for(let i=0;i<CUP_COUNT;i++){
  const yv = 1 - (i/(CUP_COUNT-1))*2;
  const rad = Math.sqrt(Math.max(0,1-yv*yv));
  const theta = golden*i;
  const n = new THREE.Vector3(Math.cos(theta)*rad, yv, Math.sin(theta)*rad).normalize();
  const cup = new THREE.Mesh(cupGeo, cupMat);
  cup.position.copy(n).multiplyScalar(SHELL_R + 0.045);
  cup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
  shellGroup.add(cup);
}

// ==========================================================
// 6. STATE (movement always on; only speed is adjustable)
// ==========================================================
let pathT = 0;
let speedMul = 1.0;
const BASE_SPEED = 2.0; // units/sec along path
let simTime = 0;
const clock = new THREE.Clock();

const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', ()=>{
  speedMul = parseFloat(speedSlider.value);
  speedVal.textContent = speedMul.toFixed(1)+'x';
});

// ==========================================================
// 7. RESIZE
// ==========================================================
let W=1,H=1;
function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W,H);
  mainCamera.aspect = W/H;
  mainCamera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ==========================================================
// 8. MAIN LOOP
// ==========================================================
function updateAlgae(dt, robotX, robotZ){
  for(const a of algaeList){
    a.mesh.position.y = waterHeight(a.x,a.z,simTime)+0.04;
    if(a.state==='idle'){
      const dx=a.x-robotX, dz=a.z-robotZ;
      if(Math.sqrt(dx*dx+dz*dz) < SHELL_R + a.baseR*0.6){
        a.state='shrinking';
      }
    } else if(a.state==='shrinking'){
      a.shrinkT += dt/0.6;
      const s = Math.max(0, 1-a.shrinkT);
      a.mesh.scale.set(s,s,s);
      if(a.shrinkT>=1){
        a.state='absorbed';
        a.mesh.visible=false;
        spawnAbsorbEffect(a.x,a.z);
      }
    }
  }
}
function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e = effects[i];
    e.t += dt;
    const p = Math.min(1, e.t/e.dur);
    e.mesh.scale.set(1+p*3.2, 1+p*3.2, 1);
    e.mesh.material.opacity = 0.9*(1-p);
    if(p>=1){
      scene.remove(e.mesh);
      e.mesh.geometry.dispose(); e.mesh.material.dispose();
      effects.splice(i,1);
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  simTime += dt;
  pathT += (BASE_SPEED*speedMul*dt)/pathLen;
  if(pathT>1) pathT -= 1;

  const p = path.getPointAt(pathT);
  const tan = path.getTangentAt(pathT);
  const bob = waterHeight(p.x,p.z,simTime)*0.6;
  robotGroup.position.set(p.x, bob+SHELL_R, p.z);

  robotGroup.up.set(0,1,0);
  robotGroup.lookAt(p.x+tan.x, bob+SHELL_R, p.z+tan.z);

  // shell rolling (drives translation)
  const linearSpeed = BASE_SPEED*speedMul;
  const shellAngSpeed = linearSpeed/SHELL_R;
  shellGroup.rotateX(shellAngSpeed*dt);

  // wheels: chassis stays put (low, steady ballast), so each wheel must
  // spin fast enough to match the shell's inner-surface speed at its own
  // contact point without slipping: ratio = shellAngSpeed * (SHELL_R/wheelR)
  bigWheel.rotateX(shellAngSpeed*(SHELL_R/WB_R)*dt);
  rightWheel.rotateX(shellAngSpeed*(SHELL_R/WS_R)*dt);
  leftWheel.rotateX(shellAngSpeed*(SHELL_R/WS_R)*dt);

  updateAlgae(dt, robotGroup.position.x, robotGroup.position.z);
  updateEffects(dt);
  waterUniforms.uTime.value = simTime;

  camTarget.lerp(robotGroup.position, Math.min(1, dt*3.5));
  updateCamera();

  renderer.render(scene, mainCamera);
}
animate();

})();
</script>
</body>
</html>
