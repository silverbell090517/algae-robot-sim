<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGA-ROVER // 수면 녹조 탐색 및 흡착 시뮬레이션</title>
<style>
  :root{
    --bg-deep:#081a1e;
    --cyan:#4fd1c5;
    --text-hi:#e7f3f2;
    --text-dim:#7fa8a5;
    --font-mono: 'SFMono-Regular', Consolas, 'Roboto Mono', ui-monospace, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    font-family:var(--font-mono);
    overflow:hidden;
    color:var(--text-hi);
  }
  #app{ position:relative; width:100vw; height:100vh; }
  canvas#scene{ position:absolute; inset:0; display:block; }

  #speedPanel{
    position:absolute; z-index:6; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:rgba(8,26,30,0.55); border:1px solid rgba(79,209,197,0.28);
    padding:10px 22px; backdrop-filter: blur(2px);
  }
  #speedPanel label{ font-size:10px; letter-spacing:0.1em; color:var(--text-dim); }
  #speedVal{ color:var(--cyan); }
  input[type=range]{
    -webkit-appearance:none; width:200px; height:2px; background:rgba(79,209,197,0.28); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--cyan); cursor:pointer; box-shadow:0 0 5px var(--cyan);
  }

  #statusPanel{
    position:absolute; z-index:6; top:18px; left:18px;
    background:rgba(8,26,30,0.55); border:1px solid rgba(79,209,197,0.28);
    padding:9px 14px; font-size:10.5px; letter-spacing:0.06em; color:var(--text-dim);
    line-height:1.7;
  }
  #statusPanel b{ color:var(--cyan); font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="statusPanel">
    MODE <b id="modeLabel">SEEKING</b><br>
    TARGET <b id="targetLabel">--</b><br>
    ALGAE LEFT <b id="algaeLeftLabel">--</b>
  </div>
  <div id="speedPanel">
    <label>SPEED <span id="speedVal">1.0x</span></label>
    <input type="range" id="speedSlider" min="0.3" max="2.5" step="0.1" value="1.0">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const bgColor = 0x081a1e;
renderer.setClearColor(bgColor, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(bgColor, 20, 50);

const mainCamera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0x8fd8ff, 0x0a2a24, 0.6));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.1);
sun.position.set(10, 18, 9);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x4fd1c5, 0.3);
fill.position.set(-8, 5, -9);
scene.add(fill);
const rimLight = new THREE.PointLight(0xbfe9ff, 0.5, 8);
rimLight.position.set(0, 0.5, -2);
scene.add(rimLight);

const camTarget = new THREE.Vector3(0, 1.0, 0);
let camRadius = 11.5, camPhi = Math.PI*0.40;
let camThetaAuto = 0;
let camInit = false;
let dragging = false, lastY=0;

function updateCamera(){
  const sinPhi = Math.sin(camPhi);
  mainCamera.position.set(
    camTarget.x + camRadius*sinPhi*Math.sin(camThetaAuto),
    camTarget.y + camRadius*Math.cos(camPhi),
    camTarget.z + camRadius*sinPhi*Math.cos(camThetaAuto)
  );
  mainCamera.lookAt(camTarget);
}

canvas.addEventListener('pointerdown', e=>{ dragging=true; lastY=e.clientY; });
window.addEventListener('pointerup', ()=> dragging=false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dy = e.clientY-lastY;
  lastY=e.clientY;
  camPhi -= dy*0.0045;
  camPhi = Math.max(0.12, Math.min(Math.PI*0.49, camPhi));
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camRadius += e.deltaY*0.015;
  camRadius = Math.max(5, Math.min(26, camRadius));
}, {passive:false});

function wrapAngle(a){
  return ((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI) - Math.PI;
}

function waterHeight(x,z,t){
  return 0.16*Math.sin(x*0.35 + t*1.1)*Math.cos(z*0.30 - t*0.9)
       + 0.10*Math.sin((x+z)*0.5 + t*1.6)
       + 0.05*Math.sin(x*0.9 - t*2.0)*Math.sin(z*0.7 + t*1.3);
}

const waterUniforms = {
  uTime:{ value:0 },
  uDeep:{ value:new THREE.Color(0x0c3e46) },
  uShallow:{ value:new THREE.Color(0x2fa39a) },
  uLight:{ value:new THREE.Vector3(0.25,0.2,0.9).normalize() }
};

const waterGeo = new THREE.PlaneGeometry(60,60,90,90);
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent:true,
  side: THREE.DoubleSide,
  vertexShader:`
    uniform float uTime;
    varying float vHeight;
    varying vec3 vNormalL;
    void main(){
      vec3 pos = position;
      float eps = 0.6;
      float h  = 0.16*sin(pos.x*0.35 + uTime*1.1)*cos(pos.y*0.30 - uTime*0.9)
               + 0.10*sin((pos.x+pos.y)*0.5 + uTime*1.6)
               + 0.05*sin(pos.x*0.9 - uTime*2.0)*sin(pos.y*0.7 + uTime*1.3);
      float hx = 0.16*sin((pos.x+eps)*0.35 + uTime*1.1)*cos(pos.y*0.30 - uTime*0.9)
               + 0.10*sin((pos.x+eps+pos.y)*0.5 + uTime*1.6)
               + 0.05*sin((pos.x+eps)*0.9 - uTime*2.0)*sin(pos.y*0.7 + uTime*1.3);
      float hy = 0.16*sin(pos.x*0.35 + uTime*1.1)*cos((pos.y+eps)*0.30 - uTime*0.9)
               + 0.10*sin((pos.x+pos.y+eps)*0.5 + uTime*1.6)
               + 0.05*sin(pos.x*0.9 - uTime*2.0)*sin((pos.y+eps)*0.7 + uTime*1.3);
      vec3 tangentX = normalize(vec3(eps, 0.0, hx-h));
      vec3 tangentY = normalize(vec3(0.0, eps, hy-h));
      vNormalL = normalize(cross(tangentX, tangentY));
      vHeight = h;
      pos.z = h;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader:`
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uLight;
    varying float vHeight;
    varying vec3 vNormalL;
    void main(){
      float diff = clamp(dot(normalize(vNormalL), uLight), 0.0, 1.0);
      vec3 base = mix(uDeep, uShallow, clamp(vHeight*2.2+0.5,0.0,1.0));
      vec3 col = base * (0.55 + 0.55*diff);
      gl_FragColor = vec4(col, 0.88);
    }
  `
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
scene.add(water);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(30,48),
  new THREE.MeshStandardMaterial({color:0x06171a, roughness:1})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.4;
scene.add(floor);

// ============================================================
// 녹조 패치: 상태(idle / shrinking / absorbed)를 갖고,
// 흡수되면 일정 시간 뒤 다른 위치에 다시 생겨서(재발생)
// "탐지 -> 이동 -> 흡착"이 반복되는 걸 계속 볼 수 있게 했다.
// ============================================================
const POND_R = 15.5;
const algaeMat = new THREE.MeshStandardMaterial({color:0x5fb84a, roughness:0.85, emissive:0x0e2a08, emissiveIntensity:0.4});
const algaeList = [];

function randomAlgaeSpot(){
  const ang = Math.random()*Math.PI*2;
  const rad = 3.5 + Math.random()*(POND_R-4);
  return { x: Math.cos(ang)*rad, z: Math.sin(ang)*rad, r: 0.8 + Math.random()*0.5 };
}

const initialSpots = [
  [13,2,1.1],[8,11,0.9],[2,15,1.2],[-6,12,1.0],[-13,3,1.1],
  [-13,-6,0.95],[-6,-12,1.15],[3,-14,1.0],[11,-8,1.05],
  [5,5,0.85],[-5,-3,0.9],[-2,8,0.95]
];
initialSpots.forEach(([x,z,r])=>{
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 14), algaeMat.clone());
  m.rotation.x = -Math.PI/2;
  m.position.set(x, waterHeight(x,z,0)+0.04, z);
  scene.add(m);
  algaeList.push({ mesh:m, x, z, baseR:r, state:'idle', shrinkT:0, respawnAt:0 });
});

const effects = [];
function spawnAbsorbEffect(x,z){
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.2,0.32,24),
    new THREE.MeshBasicMaterial({color:0x9be89b, transparent:true, opacity:0.9, side:THREE.DoubleSide})
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.set(x, waterHeight(x,z,0)+0.06, z);
  scene.add(ring);
  effects.push({ mesh:ring, t:0, dur:0.6 });
}

// ============================================================
// 로봇 본체
// ============================================================

const SHELL_R = 2.6;
const robotGroup = new THREE.Group();
scene.add(robotGroup);

const chassisGroup = new THREE.Group();
robotGroup.add(chassisGroup);

const frameMat  = new THREE.MeshStandardMaterial({color:0x3d7fa6, metalness:0.4, roughness:0.4});
const forkMat   = new THREE.MeshStandardMaterial({color:0x2c5e7d, metalness:0.5, roughness:0.35});
const wheelMat  = new THREE.MeshStandardMaterial({color:0x14151a, metalness:0.15, roughness:0.85});
const treadMat  = new THREE.MeshStandardMaterial({color:0x0a0b0e, metalness:0.1, roughness:0.9});
const rimMat    = new THREE.MeshStandardMaterial({color:0xd8dee2, metalness:0.85, roughness:0.25});
const hubMat    = new THREE.MeshStandardMaterial({color:0x2f6f95, metalness:0.45, roughness:0.3, emissive:0x0a2030, emissiveIntensity:0.3});
const axleMat   = new THREE.MeshStandardMaterial({color:0xc0c0c0, metalness:0.85, roughness:0.2});
const massMat   = new THREE.MeshStandardMaterial({color:0x1c2430, metalness:0.5, roughness:0.35, emissive:0x123244, emissiveIntensity:0.55});

const HUB = 0.8, HUB_H = 0.4;
const WS_R = 0.26, WS_W = 0.16;
const WC_R = 0.46, WC_W = 0.26;

const ARM_LEN  = SHELL_R - (HUB/2) - WS_R;
const STEM_LEN = SHELL_R - (HUB_H/2) - WC_R;

const ARM_W = 0.2, ARM_H = 0.15;
const STEM_W = 0.2, STEM_D = 0.2;

function makeWheel(r, w, treadCount){
  const group = new THREE.Group();

  const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 26), wheelMat);
  group.add(tire);

  const lugGeo = new THREE.BoxGeometry(r*0.16, w*0.92, r*0.24);
  for(let i=0;i<treadCount;i++){
    const a = (i/treadCount)*Math.PI*2;
    const lug = new THREE.Mesh(lugGeo, treadMat);
    lug.position.set(Math.cos(a)*r*0.97, 0, Math.sin(a)*r*0.97);
    lug.rotation.y = a;
    group.add(lug);
  }

  const rimMesh = new THREE.Mesh(new THREE.TorusGeometry(r*0.55, r*0.055, 8, 18), rimMat);
  rimMesh.rotation.x = Math.PI/2;
  group.add(rimMesh);

  const spokeCount = 5;
  const spokeGeo = new THREE.BoxGeometry(r*0.82, w*0.35, r*0.08);
  for(let i=0;i<spokeCount;i++){
    const a = (i/spokeCount)*Math.PI*2;
    const spoke = new THREE.Mesh(spokeGeo, rimMat);
    spoke.position.set(Math.cos(a)*r*0.4, 0, Math.sin(a)*r*0.4);
    spoke.rotation.y = a;
    group.add(spoke);
  }

  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035, w+0.28, 10), axleMat);
  group.add(axle);

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r*0.16, r*0.16, w*1.02, 12), forkMat);
  group.add(cap);

  group.rotation.z = Math.PI/2;
  return { group, tire };
}

const hub = new THREE.Mesh(new THREE.BoxGeometry(HUB, HUB_H, HUB), hubMat);
chassisGroup.add(hub);
const hubGlow = new THREE.PointLight(0x4fd1c5, 0.25, 1.4);
hubGlow.position.set(0,0.15,0);
chassisGroup.add(hubGlow);

function buildSideArm(dir){
  const arm = new THREE.Mesh(new THREE.BoxGeometry(ARM_LEN, ARM_H, ARM_W), frameMat);
  arm.position.x = dir * (HUB/2 + ARM_LEN/2);
  chassisGroup.add(arm);

  const forkGap = WS_W + 0.12;
  for(const zDir of [-1,1]){
    const prong = new THREE.Mesh(new THREE.BoxGeometry(0.1, ARM_H*1.3, 0.1), forkMat);
    prong.position.set(dir*(HUB/2+ARM_LEN), 0, zDir*forkGap/2);
    chassisGroup.add(prong);
  }

  const w = makeWheel(WS_R, WS_W, 10);
  w.group.position.set(dir*(HUB/2+ARM_LEN), 0, 0);
  chassisGroup.add(w.group);
  return w.tire;
}
const wheelR = buildSideArm(1);
const wheelL = buildSideArm(-1);

const stem = new THREE.Mesh(new THREE.BoxGeometry(STEM_W, STEM_LEN, STEM_D), frameMat);
stem.position.y = -(HUB_H/2 + STEM_LEN/2);
chassisGroup.add(stem);

const yokeSpan = WC_W + 0.5;
const yoke = new THREE.Mesh(new THREE.BoxGeometry(yokeSpan, 0.12, 0.16), forkMat);
yoke.position.y = -(HUB_H/2 + STEM_LEN);
chassisGroup.add(yoke);
for(const xDir of [-1,1]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.22, 0.1), forkMat);
  leg.position.set(xDir*yokeSpan/2, -(HUB_H/2+STEM_LEN)-0.11, 0);
  chassisGroup.add(leg);
}

const wC = makeWheel(WC_R, WC_W, 12);
wC.group.position.y = -(HUB_H/2 + STEM_LEN);
chassisGroup.add(wC.group);
const wheelC = wC.tire;

// ---- 진자(펜듈럼) 모듈 --------------------------------------------
// 허브 바로 아래 힌지에 매달린 추(rod+mass)가 좌우로 실제로 스윙한다.
// 이 스윙 각도가 곧 조향 입력이 되고(무게중심 이동 → 회전 토크),
// 새시 전체도 같은 방향으로 살짝 따라 기울어 "무게가 쏠린다"는 느낌을 준다.
const PEND_ROD_LEN = 0.95;
const pendulumPivot = new THREE.Group();
pendulumPivot.position.set(0, HUB_H/2 + 0.04, 0);
chassisGroup.add(pendulumPivot);

const pendHinge = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), axleMat);
pendulumPivot.add(pendHinge);

const pendulumRod = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, PEND_ROD_LEN, 10), axleMat);
pendulumRod.position.y = -PEND_ROD_LEN/2;
pendulumPivot.add(pendulumRod);

const pendulumMass = new THREE.Mesh(new THREE.SphereGeometry(0.27, 22, 16), massMat);
pendulumMass.position.y = -PEND_ROD_LEN;
pendulumPivot.add(pendulumMass);

const pendulumBand = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.024, 8, 20), rimMat);
pendulumBand.rotation.x = Math.PI/2;
pendulumBand.position.y = -PEND_ROD_LEN;
pendulumPivot.add(pendulumBand);

// 소형 카메라 프롭 - 이동방향(전면, +Z) 장착
const camMount = new THREE.Group();
camMount.position.set(0, 0.25, 0.45);
chassisGroup.add(camMount);
const camBody = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.22), new THREE.MeshStandardMaterial({color:0x111318, metalness:0.5, roughness:0.4}));
camMount.add(camBody);
const camLens = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.13, 14), new THREE.MeshStandardMaterial({color:0x0d0d10, metalness:0.7, roughness:0.2}));
camLens.rotation.x = Math.PI/2;
camLens.position.z = 0.16;
camMount.add(camLens);
const camGlow = new THREE.PointLight(0x4fd1c5, 0.3, 1.6);
camMount.add(camGlow);

const shellGroup = new THREE.Group();
robotGroup.add(shellGroup);
const shellMat = new THREE.MeshPhysicalMaterial({
  color:0xbfe9ff, transparent:true, opacity:0.2, roughness:0.12, metalness:0.05,
  transmission:0.2, side:THREE.FrontSide, depthWrite:false
});
shellGroup.add(new THREE.Mesh(new THREE.SphereGeometry(SHELL_R,48,32), shellMat));

const cupGeo = new THREE.CylinderGeometry(0.11,0.13,0.09,10);
const cupMat = new THREE.MeshStandardMaterial({color:0x0e3a3a, roughness:0.6, metalness:0.1});
const CUP_COUNT = 46;
const golden = Math.PI*(3-Math.sqrt(5));
for(let i=0;i<CUP_COUNT;i++){
  const yv = 1 - (i/(CUP_COUNT-1))*2;
  const rad = Math.sqrt(Math.max(0,1-yv*yv));
  const theta = golden*i;
  const n = new THREE.Vector3(Math.cos(theta)*rad, yv, Math.sin(theta)*rad).normalize();
  const cup = new THREE.Mesh(cupGeo, cupMat);
  cup.position.copy(n).multiplyScalar(SHELL_R + 0.045);
  cup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
  shellGroup.add(cup);
}

// ---- 타겟 조준선(점선) : 지금 어떤 녹조를 향해 가는지 시각화 ----
const targetLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const targetLineMat = new THREE.LineDashedMaterial({ color:0x9be8e0, dashSize:0.28, gapSize:0.18, transparent:true, opacity:0.6 });
const targetLine = new THREE.Line(targetLineGeo, targetLineMat);
targetLine.visible = false;
scene.add(targetLine);

// ============================================================
// 이동 / 조향 상태
//  - 고정 경로를 따르지 않고, 가장 가까운 녹조를 실시간으로 골라
//    그쪽으로 진자를 기울이며 다가간다 (무게중심 이동 → 회전).
// ============================================================
const robotPos = new THREE.Vector3(6, 0, 4);
let heading = Math.PI*0.8;
let leanSmoothed = 0;     // 진자 스윙 각도 (라디안)
let wanderTarget = null;
let speedFactorPrev = 1;

const LEAN_GAIN = 0.55;   // 목표 방향 오차 -> 진자 기울기
const MAX_LEAN  = 0.55;   // 진자 최대 스윙각
const TURN_GAIN = 1.35;   // 진자 기울기 -> 실제 회전각속도

function findNearestIdleAlgae(){
  let best=null, bestD=Infinity;
  for(const a of algaeList){
    if(a.state!=='idle') continue;
    const dx=a.x-robotPos.x, dz=a.z-robotPos.z;
    const d=dx*dx+dz*dz;
    if(d<bestD){ bestD=d; best=a; }
  }
  return best;
}

let pathT = 0;
let speedMul = 1.0;
const BASE_SPEED = 1.1;
let simTime = 0;
const clock = new THREE.Clock();

const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', ()=>{
  speedMul = parseFloat(speedSlider.value);
  speedVal.textContent = speedMul.toFixed(1)+'x';
});

const modeLabel = document.getElementById('modeLabel');
const targetLabel = document.getElementById('targetLabel');
const algaeLeftLabel = document.getElementById('algaeLeftLabel');

let W=1,H=1;
function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W,H);
  mainCamera.aspect = W/H;
  mainCamera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

function updateAlgae(dt, robotX, robotZ){
  let idleCount = 0;
  for(const a of algaeList){
    if(a.state==='idle'){
      idleCount++;
      a.mesh.position.y = waterHeight(a.x,a.z,simTime)+0.04;
      const dx=a.x-robotX, dz=a.z-robotZ;
      if(Math.sqrt(dx*dx+dz*dz) < SHELL_R + a.baseR*0.6){
        a.state='shrinking';
      }
    } else if(a.state==='shrinking'){
      a.mesh.position.y = waterHeight(a.x,a.z,simTime)+0.04;
      a.shrinkT += dt/0.6;
      const s = Math.max(0, 1-a.shrinkT);
      a.mesh.scale.set(s,s,s);
      if(a.shrinkT>=1){
        a.state='absorbed';
        a.mesh.visible=false;
        spawnAbsorbEffect(a.x,a.z);
        a.respawnAt = simTime + 8 + Math.random()*10; // 시간이 지나면 다른 위치에서 재발생
      }
    } else if(a.state==='absorbed'){
      if(simTime >= a.respawnAt){
        const spot = randomAlgaeSpot();
        a.x = spot.x; a.z = spot.z; a.baseR = spot.r;
        a.mesh.position.set(a.x, waterHeight(a.x,a.z,simTime)+0.04, a.z);
        a.mesh.scale.set(1,1,1);
        a.mesh.visible = true;
        a.shrinkT = 0;
        a.state = 'idle';
        idleCount++;
      }
    }
  }
  return idleCount;
}
function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e = effects[i];
    e.t += dt;
    const p = Math.min(1, e.t/e.dur);
    e.mesh.scale.set(1+p*3.2, 1+p*3.2, 1);
    e.mesh.material.opacity = 0.9*(1-p);
    if(p>=1){
      scene.remove(e.mesh);
      e.mesh.geometry.dispose(); e.mesh.material.dispose();
      effects.splice(i,1);
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  const idleLeft = updateAlgae(dt, robotPos.x, robotPos.z);
  updateEffects(dt);
  waterUniforms.uTime.value = simTime;

  // ---- 타겟 선정: 가장 가까운 활성 녹조, 없으면 배회 지점 ----
  const targetAlgae = findNearestIdleAlgae();
  let targetX, targetZ;
  if(targetAlgae){
    targetX = targetAlgae.x; targetZ = targetAlgae.z;
    targetAlgae.mesh.material.emissiveIntensity = 0.55 + 0.25*Math.sin(simTime*5);
    modeLabel.textContent = 'SEEKING';
    targetLabel.textContent = `(${targetX.toFixed(1)}, ${targetZ.toFixed(1)})`;
  } else {
    if(!wanderTarget || Math.hypot(wanderTarget.x-robotPos.x, wanderTarget.z-robotPos.z) < 1.5){
      const ang = Math.random()*Math.PI*2;
      const rad = 4 + Math.random()*9;
      wanderTarget = { x: Math.cos(ang)*rad, z: Math.sin(ang)*rad };
    }
    targetX = wanderTarget.x; targetZ = wanderTarget.z;
    modeLabel.textContent = 'PATROL';
    targetLabel.textContent = '--';
  }
  algaeLeftLabel.textContent = idleLeft;

  // ---- 진자 기반 조향 ----
  const desiredHeading = Math.atan2(targetX-robotPos.x, targetZ-robotPos.z);
  const headingError = wrapAngle(desiredHeading - heading);
  const leanTargetAngle = THREE.MathUtils.clamp(headingError*LEAN_GAIN, -MAX_LEAN, MAX_LEAN);
  leanSmoothed += (leanTargetAngle - leanSmoothed) * Math.min(1, dt*2.6);

  const turnRate = leanSmoothed * TURN_GAIN;
  heading += turnRate*dt;

  const speedFactor = THREE.MathUtils.clamp(1 - Math.abs(headingError)/Math.PI*0.6, 0.35, 1);
  const linearSpeed = BASE_SPEED*speedMul*speedFactor;

  robotPos.x += Math.sin(heading)*linearSpeed*dt;
  robotPos.z += Math.cos(heading)*linearSpeed*dt;

  // 연못 경계를 넘지 않도록 부드럽게 안쪽으로 되돌림
  const distFromCenter = Math.hypot(robotPos.x, robotPos.z);
  if(distFromCenter > POND_R){
    const k = POND_R/distFromCenter;
    robotPos.x *= k; robotPos.z *= k;
  }

  const bob = waterHeight(robotPos.x, robotPos.z, simTime)*0.6;
  robotGroup.position.set(robotPos.x, bob+SHELL_R, robotPos.z);
  robotGroup.up.set(0,1,0);
  robotGroup.lookAt(robotPos.x+Math.sin(heading), bob+SHELL_R, robotPos.z+Math.cos(heading));

  const desiredTheta = heading + Math.PI;
  if(!camInit){ camThetaAuto = desiredTheta; camInit = true; }
  camThetaAuto += wrapAngle(desiredTheta - camThetaAuto) * Math.min(1, dt*4.0);

  // 진자 스윙 + 새시 밴킹(진자가 쏠리는 쪽으로 프레임도 살짝 따라 기움)
  pendulumPivot.rotation.z = -leanSmoothed*1.6;
  chassisGroup.rotation.z = leanSmoothed*0.4;

  const shellAngSpeed = linearSpeed/SHELL_R;
  shellGroup.rotateX(shellAngSpeed*dt);
  wheelC.rotateY(shellAngSpeed * dt * (SHELL_R / WC_R));

  const sideWheelRot = turnRate * dt * (SHELL_R / WS_R) * 2.5;
  wheelR.rotateY(sideWheelRot);
  wheelL.rotateY(-sideWheelRot);

  // ---- 타겟 조준선 갱신 ----
  if(targetAlgae){
    const p0 = new THREE.Vector3(robotPos.x, bob+0.06, robotPos.z);
    const p1 = new THREE.Vector3(targetAlgae.x, waterHeight(targetAlgae.x,targetAlgae.z,simTime)+0.06, targetAlgae.z);
    targetLine.geometry.setFromPoints([p0,p1]);
    targetLine.computeLineDistances();
    targetLine.visible = true;
  } else {
    targetLine.visible = false;
  }

  const forward = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
  const lookAheadPos = new THREE.Vector3(
    robotPos.x + forward.x*4.0,
    robotGroup.position.y,
    robotPos.z + forward.z*4.0
  );
  camTarget.lerp(lookAheadPos, Math.min(1, dt*3.5));
  updateCamera();

  speedFactorPrev = speedFactor;
  renderer.render(scene, mainCamera);
}
animate();

})();
</script>
